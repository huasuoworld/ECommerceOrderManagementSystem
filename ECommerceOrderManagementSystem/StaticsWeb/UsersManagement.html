<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management | Market Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">
    <main class="container py-4">
        <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
                <p class="text-success fw-semibold mb-1">MARKET DESK</p>
                <h1 class="h2 mb-0">User Management</h1>
                <p class="text-secondary mb-0 mt-2">Browse registered user accounts.</p>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <a class="btn btn-outline-secondary" href="/products">Storefront</a>
                <button class="btn btn-primary" id="refresh-users" type="button">Refresh</button>
                <!-- Notification dropdown -->
                <ul class="navbar-nav">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle position-relative px-2 text-dark" href="#" id="messagesDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-bell fs-5"></i>
                            <span id="msgBadge" class="position-absolute top-25 start-75 translate-middle p-1 bg-danger border border-light rounded-circle d-none">
                                <span class="visually-hidden">New alerts</span>
                            </span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="messagesDropdown" style="width: 320px; max-height: 400px; overflow-y: auto;">
                            <li><h6 class="dropdown-header d-flex justify-content-between align-items-center">
                                <span>Notification Center</span>
                                <small class="text-muted">Alerts</small>
                            </h6></li>
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- Notification list -->
                            <div id="notificationListContainer">
                                <li><span class="dropdown-item text-muted text-center py-2">No notifications</span></li>
                            </div>
                            
                            <li><hr class="dropdown-divider"></li>
                            
                            <!-- Pagination controls -->
                            <li>
                                <div class="px-3 d-flex justify-content-between align-items-center">
                                    <button class="btn btn-sm btn-outline-secondary" id="prevMsgPage" disabled>Previous</button>
                                    <span class="text-muted small" id="msgPageInfo">Page 1 of 1</span>
                                    <button class="btn btn-sm btn-outline-secondary" id="nextMsgPage" disabled>Next</button>
                                </div>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </header>

        <section class="card border-0 shadow-sm" aria-labelledby="users-title">
            <div class="card-header bg-white d-flex flex-wrap align-items-center justify-content-between gap-2 py-3">
                <h2 class="h5 mb-0" id="users-title">User List</h2>
                <span class="text-secondary small" id="users-count" aria-live="polite"></span>
            </div>
            <div id="users-message" class="alert rounded-0 mb-0 d-none" role="status"></div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Username</th>
                            <th scope="col">Display Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Phone</th>
                            <th scope="col">Status</th>
                            <th scope="col">Created</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="users-list">
                        <tr><td colspan="7" class="text-center text-secondary py-5">Loading users…</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white d-flex flex-wrap align-items-center justify-content-between gap-3">
                <span class="small text-secondary" id="users-pagination-summary" aria-live="polite"></span>
                <nav aria-label="User list pagination">
                    <ul class="pagination pagination-sm mb-0" id="users-pagination"></ul>
                </nav>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="/static/CommonUtil.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/UsersManagement.js" defer></script>
</body>
</html>
