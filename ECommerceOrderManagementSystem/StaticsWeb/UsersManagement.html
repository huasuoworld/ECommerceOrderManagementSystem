<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User Management | Market Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-4">
        <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
                <p class="text-success fw-semibold mb-1">MARKET DESK</p>
                <h1 class="h2 mb-0">User Management</h1>
                <p class="text-secondary mb-0 mt-2">View your account profile.</p>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" href="/products">Storefront</a>
                <button class="btn btn-primary" id="refresh-profile" type="button">Refresh</button>
            </div>
        </header>

        <section class="card border-0 shadow-sm" aria-labelledby="profile-title">
            <div class="card-header bg-white d-flex flex-wrap align-items-center justify-content-between gap-2 py-3">
                <h2 class="h5 mb-0" id="profile-title">My Account</h2>
                <span class="text-secondary small" id="profile-summary" aria-live="polite"></span>
            </div>
            <div id="profile-message" class="alert rounded-0 mb-0 d-none" role="status"></div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Username</th>
                            <th scope="col">Display Name</th>
                            <th scope="col">Email</th>
                            <th scope="col">Phone</th>
                            <th scope="col">Status</th>
                            <th scope="col">Created</th>
                        </tr>
                    </thead>
                    <tbody id="profile-details">
                        <tr><td colspan="6" class="text-center text-secondary py-5">Loading account profile…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="/static/CommonUtil.js"></script>
    <script src="/static/UsersManagement.js" defer></script>
</body>
</html>
