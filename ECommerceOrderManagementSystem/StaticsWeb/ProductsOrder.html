<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5ef">
    <title>My Orders | Market Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #1d2923;
            --paper: #f3f5ef;
            --pine: #174b3b;
            --lime: #c7ed78;
            --coral: #d56d50;
        }

        body {
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: inline-grid;
            place-items: center;
            border-radius: 8px;
            background: var(--lime);
            color: var(--pine);
            font-size: 20px;
            font-weight: 700;
        }

        .brand-name {
            color: var(--pine);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow {
            color: var(--coral);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .order-card {
            border-color: rgba(29, 41, 35, 0.08);
            box-shadow: 0 12px 32px rgba(27, 54, 40, 0.06);
        }

        .order-number { color: var(--pine); }
        .order-total { color: var(--pine); font-size: 20px; }
    </style>
</head>
<body>
    <main class="container py-4 py-md-5">
        <header class="d-flex align-items-center justify-content-between gap-3 mb-5">
            <div class="d-flex align-items-center gap-3">
                <span class="brand-mark" aria-hidden="true">M</span>
                <span class="brand-name">Market Desk</span>
            </div>
            <a class="btn btn-outline-success" href="/products">Continue shopping</a>
        </header>

        <section aria-labelledby="page-title">
            <div class="mb-4">
                <p class="eyebrow mb-2">Your purchases</p>
                <h1 class="h2 fw-semibold mb-2" id="page-title">My Orders</h1>
                <p class="text-secondary mb-0">Review your orders and payment status.</p>
            </div>
            <div id="order-message" class="alert d-none" role="alert" aria-live="polite"></div>
            <div id="order-list" class="d-flex flex-column gap-3" aria-live="polite">
                <p class="text-secondary">Loading your orders...</p>
            </div>
            <div id="checkout-confirmation" class="mt-3 d-none"></div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="/static/CommonUtil.js?v=order-payment-20261018"></script>
    <script src="/static/ProductsOrder.js?v=order-payment-20261018" defer></script>
    <script src="/static/ProductsOrderPayment.js?v=order-payment-20261018" defer></script>
</body>
</html>
