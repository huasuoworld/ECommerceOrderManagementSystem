<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Product Management | Market Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container py-4">
        <header class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
            <div>
                <p class="text-success fw-semibold mb-1">MARKET DESK</p>
                <h1 class="h2 mb-0">Product Management</h1>
            </div>
            <div class="d-flex gap-2">
                <a class="btn btn-outline-secondary" href="/products">Storefront</a>
                <button class="btn btn-primary" id="refresh-products" type="button">Refresh</button>
            </div>
        </header>

        <section class="card border-0 shadow-sm" aria-labelledby="product-list-title">
            <div class="card-header bg-white d-flex flex-wrap align-items-center justify-content-between gap-2 py-3">
                <h2 class="h5 mb-0" id="product-list-title">Product List</h2>
                <span class="text-secondary small" id="product-count" aria-live="polite"></span>
            </div>
            <div id="product-message" class="alert rounded-0 mb-0 d-none" role="status"></div>
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                        <tr>
                            <th scope="col">Product</th>
                            <th scope="col">Category / Brand</th>
                            <th scope="col">SKU</th>
                            <th scope="col" class="text-end">Price</th>
                            <th scope="col">Inventory Status</th>
                        </tr>
                    </thead>
                    <tbody id="product-list">
                        <tr><td colspan="5" class="text-center text-secondary py-5">Loading products…</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer bg-white d-flex flex-wrap align-items-center justify-content-between gap-3">
                <span class="small text-secondary" id="pagination-summary" aria-live="polite"></span>
                <nav aria-label="Product list pagination">
                    <ul class="pagination pagination-sm mb-0" id="product-pagination"></ul>
                </nav>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="/static/CommonUtil.js"></script>
    <script src="/static/ProductsManagement.js" defer></script>
</body>
</html>
