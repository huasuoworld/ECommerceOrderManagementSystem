<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5ef">
    <title>Products | Market Desk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #1d2923;
            --muted: #737d75;
            --paper: #f3f5ef;
            --pine: #174b3b;
            --lime: #c7ed78;
            --coral: #d56d50;
        }

        body {
            min-height: 100vh;
            background: var(--paper);
            color: var(--ink);
            font-family: "DM Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: inline-grid;
            place-items: center;
            border-radius: 8px;
            background: var(--lime);
            color: var(--pine);
            font-size: 20px;
            font-weight: 700;
        }

        .brand-name {
            color: var(--pine);
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .eyebrow {
            color: var(--coral);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .product-card {
            overflow: hidden;
            border-color: rgba(29, 41, 35, 0.08);
            box-shadow: 0 12px 32px rgba(27, 54, 40, 0.06);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 38px rgba(27, 54, 40, 0.1);
        }

        .product-image {
            height: 210px;
            background: linear-gradient(145deg, #eaf0e5, #f7f7f0);
            object-fit: cover;
        }

        .image-placeholder {
            height: 210px;
            display: grid;
            place-items: center;
            background: linear-gradient(145deg, #eaf0e5, #f7f7f0);
            color: var(--pine);
            font-size: 54px;
        }

        .product-name { font-size: 18px; }
        .product-sub-name { min-height: 20px; color: var(--muted); font-size: 12px; }
        .product-description { min-height: 42px; color: #5f6962; font-size: 12px; line-height: 1.7; }

        .attribute {
            background: var(--paper);
            color: #566259;
            font-size: 11px;
        }

        .current-price {
            color: var(--pine);
            font-size: 22px;
            font-weight: 700;
        }

        .original-price { color: #929b93; font-size: 12px; }
        .discount-label { color: var(--coral); font-size: 11px; font-weight: 600; }
        .product-code { color: #929b93; font-size: 10px; }
        .cart-toggle { background: var(--pine); border-color: var(--pine); }
        .cart-toggle:hover, .cart-toggle:focus { background: #10392c; border-color: #10392c; }
        .cart-item-image {
            width: 56px;
            height: 56px;
            display: grid;
            flex: 0 0 auto;
            place-items: center;
            border-radius: 4px;
            background: linear-gradient(145deg, #eaf0e5, #f7f7f0);
            color: var(--pine);
            font-size: 24px;
            object-fit: cover;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="container py-4 py-md-5">
        <header class="d-flex align-items-center justify-content-between gap-3 mb-5">
            <div class="d-flex align-items-center gap-3">
                <span class="brand-mark" aria-hidden="true">M</span>
                <span class="brand-name">Market Desk</span>
            </div>
            <button class="btn btn-primary cart-toggle" id="cart-toggle" type="button"
                    aria-expanded="false" aria-controls="cart-panel">
                Cart <span class="badge text-bg-light ms-1" id="cart-item-count">0</span>
            </button>
        </header>

        <section class="card border-0 shadow-sm mb-5 d-none" id="cart-panel" aria-labelledby="cart-title">
            <div class="card-body p-4">
                <div class="d-flex align-items-center justify-content-between gap-3 mb-3">
                    <h2 class="h4 mb-0" id="cart-title">Shopping Cart</h2>
                    <button class="btn-close" id="cart-close" type="button" aria-label="Close cart"></button>
                </div>
                <div id="cart-message" class="alert d-none" role="alert"></div>
                <div id="cart-items"></div>
                <div class="d-flex align-items-center justify-content-between border-top pt-3 mt-3">
                    <span class="fw-semibold">Subtotal</span>
                    <span class="fw-bold" id="cart-subtotal">CA$0</span>
                </div>
            </div>
        </section>

        <section aria-labelledby="page-title">
            <div class="d-flex flex-column flex-sm-row align-items-sm-end justify-content-between gap-3 mb-4">
                <div>
                    <p class="eyebrow mb-2">Curated for you</p>
                    <h1 class="h2 fw-semibold mb-2" id="page-title">Products</h1>
                    <p class="text-secondary mb-0">Explore our collection and find something you'll love.</p>
                </div>
                <span class="badge rounded-pill text-bg-white border text-secondary fw-normal px-3 py-2"
                      id="product-count" aria-live="polite"></span>
            </div>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4" id="product-list"
                 aria-label="Product list"></div>
            <div class="d-flex flex-column flex-sm-row align-items-center justify-content-between gap-3 mt-4">
                <p class="small text-secondary mb-0" id="pagination-summary" aria-live="polite"></p>
                <nav aria-label="Product pages">
                    <ul class="pagination mb-0" id="product-pagination"></ul>
                </nav>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="/static/CommonUtil.js"></script>
    <script src="/static/Products.js" defer></script>
</body>
</html>
