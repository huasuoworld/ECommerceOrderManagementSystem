<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f5ef">
    <title>Sign in | Market Desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            color-scheme: light;
            --ink: #1d2923;
            --muted: #737d75;
            --paper: #f3f5ef;
            --pine: #174b3b;
            --lime: #c7ed78;
            --coral: #d56d50;
            --line: #e4e9e1;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            background-color: var(--paper);
            background-image: radial-gradient(#dce3d8 0.7px, transparent 0.7px);
            background-size: 18px 18px;
            color: var(--ink);
            font-family: "DM Sans", sans-serif;
        }

        .login-shell {
            width: min(100%, 980px);
            min-height: 570px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 0.92fr 1.08fr;
            background: #fff;
            border: 1px solid rgba(29, 41, 35, 0.08);
            border-radius: 8px;
            box-shadow: 0 24px 70px rgba(27, 54, 40, 0.12);
            animation: arrive 420ms ease-out both;
        }

        .brand-panel {
            position: relative;
            isolation: isolate;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            padding: 42px;
            background: var(--pine);
            color: #fff;
        }

        .brand-panel::before {
            position: absolute;
            z-index: -1;
            inset: 0;
            background: repeating-linear-gradient(135deg, transparent 0 31px, rgba(255, 255, 255, 0.055) 32px 33px);
            content: "";
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border-radius: 8px;
            background: var(--lime);
            color: var(--pine);
            font-family: "Space Grotesk", sans-serif;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-name {
            margin-left: 12px;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .brand-heading {
            max-width: 360px;
            margin: 54px 0 16px;
            font-family: "Space Grotesk", sans-serif;
            font-size: clamp(36px, 4vw, 52px);
            font-weight: 600;
            line-height: 1.04;
        }

        .brand-copy {
            max-width: 310px;
            margin: 0;
            color: rgba(255, 255, 255, 0.74);
            font-size: 15px;
            line-height: 1.7;
        }

        .brand-note {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.76);
            font-size: 12px;
        }

        .brand-note span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--lime);
        }

        .form-panel {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 56px clamp(28px, 6vw, 76px);
        }

        .form-content { width: 100%; max-width: 360px; }

        .eyebrow {
            margin-bottom: 12px;
            color: var(--coral);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: "Space Grotesk", sans-serif;
            font-size: 34px;
            font-weight: 600;
            letter-spacing: 0;
        }

        .form-intro {
            margin: 10px 0 32px;
            color: var(--muted);
            font-size: 14px;
        }

        .form-label {
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 600;
        }

        .form-control {
            min-height: 48px;
            border-color: var(--line);
            border-radius: 4px;
            color: var(--ink);
            font-size: 14px;
            box-shadow: none;
        }

        .form-control:focus {
            border-color: var(--pine);
            box-shadow: 0 0 0 3px rgba(23, 75, 59, 0.12);
        }

        .password-wrap { position: relative; }
        .password-wrap .form-control { padding-right: 70px; }

        .password-toggle {
            position: absolute;
            top: 50%;
            right: 12px;
            padding: 4px;
            transform: translateY(-50%);
            border: 0;
            background: transparent;
            color: var(--pine);
            font-size: 12px;
            font-weight: 700;
        }

        .btn-signin {
            min-height: 48px;
            border: 0;
            border-radius: 4px;
            background: var(--pine);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            transition: background-color 140ms ease, transform 140ms ease;
        }

        .btn-signin:hover, .btn-signin:focus-visible {
            background: #103b2e;
            color: #fff;
            transform: translateY(-1px);
        }

        .feedback:empty { display: none; }

        .form-footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
        }

        @keyframes arrive {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 700px) {
            body { display: block; padding: 14px; }
            .login-shell { min-height: calc(100vh - 28px); grid-template-columns: 1fr; }
            .brand-panel { min-height: 168px; padding: 22px 24px; }
            .brand-heading { margin: 22px 0 0; font-size: 30px; }
            .brand-copy, .brand-note { display: none; }
            .form-panel { align-items: flex-start; padding: 38px 24px; }
            .form-intro { margin-bottom: 26px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <main class="login-shell" aria-labelledby="login-title">
        <section class="brand-panel" aria-label="Market Desk">
            <div class="d-flex align-items-center">
                <div class="brand-mark" aria-hidden="true">M</div>
                <span class="brand-name">Market Desk</span>
            </div>
            <div>
                <h2 class="brand-heading">A clearer view of every order.</h2>
                <p class="brand-copy">Your workspace for keeping products, people, and orders moving.</p>
            </div>
            <div class="brand-note"><span aria-hidden="true"></span>Order operations workspace</div>
        </section>

        <section class="form-panel">
            <div class="form-content">
                <p class="eyebrow">Welcome back</p>
                <h1 id="login-title">Sign in</h1>
                <p class="form-intro">Enter your account details to continue.</p>

                <div id="login-feedback" class="alert feedback py-2 px-3 mb-3" role="status" aria-live="polite"></div>

                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control" type="text" id="username" name="username" autocomplete="username" placeholder="Your username" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <div class="password-wrap">
                            <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" placeholder="Your password" required>
                            <button class="password-toggle" type="button" id="toggle-password" aria-pressed="false">Show</button>
                        </div>
                    </div>
                    <button class="btn btn-signin w-100" id="submit-button" type="submit">Sign in</button>
                </form>

                <div class="form-footer">Secure access to your order workspace</div>
            </div>
        </section>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.5/dist/js.cookie.min.js"></script>
    <script src="/static/CommonUtil.js"></script>
    <script src="/static/UsersLogin.js"></script>
</body>
</html>
